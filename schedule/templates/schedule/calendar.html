{% extends 'accounts/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">My Calendar</h2>
    <div id="calendar" class="mb-4"></div>

    <h3 class="text-center mb-3">Meetings</h3>
    <div class="text-center">
        <a href="{% url 'create_meeting' %}" class="btn btn-primary">Create Meeting</a>
    </div>
</div>

<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Lista de reuniões passada pelo contexto
        var meetings = [
            {% for meeting in meetings %}
            {
            id: {{ meeting.id }},
        title: "{{ meeting.title|escapejs }}",
        start: "{{ meeting.start_time }}",
        end: "{{ meeting.end_time }}"
            }{% if not forloop.last %}, {% endif %}
    {% endfor %}
        ];

    // Inicialização do calendário
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        events: meetings,
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        eventClick: function (info) {
            // Redireciona para os detalhes do evento
            window.location.href = `/events/${info.event.id}/`;
        }
    });

    // Renderiza o calendário
    calendar.render();
    });
</script>
{% endblock %}
